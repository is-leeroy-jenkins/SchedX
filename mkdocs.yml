site_name: Schedx Documentation
site_description: Documentation for the Schedx Schedule-X analytics application.
site_author: Terry D. Eppler
site_url: ""

repo_url: ""
repo_name: ""

theme:
  name: material
  language: en
  logo: images/schedx-logo.png
  favicon: images/favicon.ico
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.select
  palette:
    - scheme: slate
      primary: blue
      accent: blue
  font:
    text: Roboto
    code: Roboto Mono

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - .
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            filters:
              - "!^_"

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - assets/css/schedx.css

extra_javascript:
  - assets/js/schedx.js

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Data Expectations: data-expectations.md
  - User Guide:
      - Overview: user-guide/index.md
      - Installation: user-guide/installation.md
      - Data Loading: user-guide/data-loading.md
      - Data Overview: user-guide/overview.md
      - Descriptive Statistics: user-guide/descriptive-statistics.md
      - Inferential Statistics: user-guide/inferential-statistics.md
      - Feature Analysis: user-guide/feature-analysis.md
      - Dimensionality Reduction: user-guide/dimensionality-reduction.md
      - Clustering: user-guide/clustering.md
      - Anomaly Detection: user-guide/anomaly-detection.md
      - Modeling: user-guide/modeling.md
      - Forecasting: user-guide/forecasting.md
      - Export: user-guide/export.md
  - API Reference:
      - Overview: api/index.md
      - Application: api/app.md
  - Deployment: deployment.md
  - Development: development.md